name: Security Scan

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  dependency-and-secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Dependency audit
        run: npm audit --audit-level=high
      - name: Secret pattern scan
        shell: bash
        run: |
          set -euo pipefail
          ! grep -RInE '(PRIVATE_KEY=|SECRET_KEY=|BEGIN (RSA|OPENSSH|EC) PRIVATE KEY|ghp_[A-Za-z0-9_]{30,}|xox[baprs]-)' \
            --exclude-dir=.git \
            --exclude-dir=.github \
            --exclude-dir=node_modules \
            --exclude-dir=target \
            --exclude-dir=dist \
            .
          if [ -e dist/final-command-transcript.txt ] || [ -e dist/auditor-packet ]; then
            ! grep -RInE '(C:\\Users|D:\\|\.config/solana/id\.json|PRIVATE_KEY|SECRET_KEY)' \
              dist/final-command-transcript.txt dist/auditor-packet 2>/dev/null
          fi
