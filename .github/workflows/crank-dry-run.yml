name: Crank Dry Run

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

jobs:
  referral-cleanup-dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PROGRAM_ID: ${{ secrets.PROGRAM_ID }}
      RPC_URL: ${{ secrets.RPC_URL }}
      CRANK_DRY_RUN: "true"
      CRANK_RUN_ONCE: "true"
      BATCH_SIZE: "6"

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build crank
        run: npm run build --workspace viral-sync-cranks

      - name: Run cleanup scan
        run: npm run start --workspace viral-sync-cranks
