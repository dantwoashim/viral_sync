name: Verify

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Solana
        id: solana-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/solana
          key: ${{ runner.os }}-solana-1.18.23-v2

      - name: Install Solana Tool Suite
        shell: bash
        run: |
          set -euo pipefail
          SOLANA_BIN="$HOME/.local/share/solana/install/active_release/bin"
          if [ ! -x "$SOLANA_BIN/solana" ] || [ ! -x "$SOLANA_BIN/cargo-build-sbf" ]; then
            rm -rf "$HOME/.local/share/solana/install"
            INSTALLER="$(mktemp)"
            for URL in \
              "https://release.anza.xyz/v1.18.23/install" \
              "https://release.solana.com/v1.18.23/install"
            do
              if curl --fail --show-error --silent --location --retry 5 --retry-delay 3 --retry-all-errors "$URL" -o "$INSTALLER"; then
                bash "$INSTALLER"
                break
              fi
            done
          fi
          test -x "$SOLANA_BIN/solana"
          test -x "$SOLANA_BIN/cargo-build-sbf"
          echo "$SOLANA_BIN" >> "$GITHUB_PATH"
          "$SOLANA_BIN/solana" --version
          "$SOLANA_BIN/cargo-build-sbf" --version

      - name: Install AVM and Anchor
        run: |
          cargo install --git https://github.com/coral-xyz/anchor avm --locked --force
          avm install 0.30.1
          avm use 0.30.1

      - name: Install dependencies
        run: npm ci

      - name: Verify workspace
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/share/solana/install/active_release/bin:$PATH"
          solana --version
          cargo-build-sbf --version
          mkdir -p "$HOME/.config/solana"
          solana-keygen new --no-bip39-passphrase --silent --force -o "$HOME/.config/solana/id.json"
          solana-test-validator --reset --quiet > /tmp/viral-sync-validator.log 2>&1 &
          VALIDATOR_PID=$!
          trap 'kill "$VALIDATOR_PID" 2>/dev/null || true' EXIT
          for _ in {1..45}; do
            if solana cluster-version --url http://127.0.0.1:8899 >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          solana config set --url http://127.0.0.1:8899
          solana airdrop 10 "$(solana address)" >/dev/null
          anchor build
          anchor deploy --provider.cluster localnet
          RUN_ANCHOR_ATTACK_TESTS=1 npm run verify
