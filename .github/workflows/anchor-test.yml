name: Verify

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Solana
        id: solana-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/solana
          key: ${{ runner.os }}-solana-1.18.23-v2

      - name: Install Solana Tool Suite
        shell: bash
        run: |
          set -euo pipefail
          SOLANA_BIN="$HOME/.local/share/solana/install/active_release/bin"
          if [ ! -x "$SOLANA_BIN/solana" ] || [ ! -x "$SOLANA_BIN/cargo-build-sbf" ]; then
            rm -rf "$HOME/.local/share/solana/install"
            sh -c "$(curl -sSfL https://release.solana.com/v1.18.23/install)"
          fi
          echo "$SOLANA_BIN" >> "$GITHUB_PATH"
          "$SOLANA_BIN/solana" --version
          "$SOLANA_BIN/cargo-build-sbf" --version

      - name: Install AVM and Anchor
        run: |
          cargo install --git https://github.com/coral-xyz/anchor avm --locked --force
          avm install 0.30.1
          avm use 0.30.1

      - name: Install dependencies
        run: npm ci

      - name: Verify workspace
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/share/solana/install/active_release/bin:$PATH"
          solana --version
          cargo-build-sbf --version
          npm run verify
